[package]
name = "dusk"
version = "0.3.28"
description = "Your machines, one app: host and stream across them"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77"

[lib]
name = "dusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` because Dusk replaces Sunshine's menu bar item with its own;
# `image-png` so the tray can be built from the icon already in `icons/`.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps Sunshine's state file in its own key order when
# Dusk rewrites it.
serde_json = { version = "1", features = ["preserve_order"] }
# "net" and "io-util" are for the per-session control socket the stream
# client talks back over — a unix socket here, a named pipe on Windows.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util"] }
futures-util = "0.3"
mdns-sd = "0.11"
quick-xml = "0.36"
thiserror = "1"
gethostname = "0.5"
async-trait = "0.1"
sha2 = "0.10"
# The control socket's one-time token. Already in the tree under rustls;
# naming it directly beats hand-rolling randomness out of the clock.
getrandom = "0.2"
# Each machine's signing key, for vouching to your other machines that a
# pairing request really comes from one of yours. Already in the tree under
# rustls.
ring = "0.17"
if-addrs = "0.13"
# Sealing the addresses a machine publishes to its account, so a secret gist
# holds ciphertext rather than a map of someone's network. ring's X25519 is
# ephemeral-only by design and a recipient's key has to outlive the message,
# which is the one thing it will not do.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# The Sunshine web-UI password belongs in the OS keystore, not a JSON file.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Opening at sign-in: a launch agent, a Run key or an autostart file, each
# written the way its platform expects.
tauri-plugin-autostart = "2"
# A Dusk waiting in the tray is shown, not doubled, when launched again.
tauri-plugin-single-instance = "2"
# Self-update from the GitHub release's latest.json, signed with Dusk's own
# key, and the relaunch that finishes one.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
minisign-verify = "0.3.0"
base64 = "0.23.1"

# Reading moonlight-qt's identity out of its QSettings store, which is a
# different backend on each platform: a plist on macOS, an INI file on Linux
# (handled in-tree), and the registry on Windows.
[target.'cfg(unix)'.dependencies]
# getuid, for the launchd user domain every launchctl verb needs.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Unlocking the Secret Service on a machine that logs in automatically, so
# `dusk setup` can reach the keystore over SSH. Already in the tree under
# keyring's sync-secret-service, so this names it rather than adding it.
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
# SetupAPI, to create the device a virtual display driver installs onto.
# The version the rest of the tree already pulls in.
windows-sys = { version = "0.59", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation"] }

# rustls rather than the platform TLS stack: both Sunshine's GameStream port
# and its config API serve self-signed certificates, and client-certificate
# auth is far easier to drive consistently across three platforms with rustls.
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "json", "stream"]

# Direct, because Sunshine's TLS server aborts a resumed handshake and
# reqwest exposes no way to turn resumption off — see `state::tls_client`.
# "ring" must match the provider reqwest's rustls-tls feature pulls in.
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.rustls-pemfile]
version = "2"
