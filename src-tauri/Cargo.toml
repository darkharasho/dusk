[package]
name = "dusk"
version = "0.1.0"
description = "One shell over Sunshine and Moonlight"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
futures-util = "0.3"
mdns-sd = "0.11"
quick-xml = "0.36"
thiserror = "1"
gethostname = "0.5"
if-addrs = "0.13"

# rustls rather than the platform TLS stack: Sunshine's certificate is
# self-signed, and M2 needs client-certificate auth on the TLS port, which is
# far easier to drive consistently across three platforms with rustls.
# Reading moonlight-qt's identity out of its QSettings store, which is a
# different backend on each platform: a plist on macOS, an INI file on Linux
# (handled in-tree), and the registry on Windows.
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]
