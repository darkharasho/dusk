name: Release

on:
  push:
    tags: ['v*']
  # Lets the signing and notarization path be exercised without cutting a tag.
  # Artifacts are uploaded to the run; no release is created or published.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

  # The Moonlight client this Dusk ships. It is a fork carrying the in-stream
  # overlay, built and published by its own repository because a second Qt
  # toolchain here would be a thing to maintain for no benefit.
  #
  # Pinned rather than "latest" on purpose: the two are a matched pair, and a
  # tagged Dusk should build the same way next year as it does today.
  CLIENT_REPO: darkharasho/dusk-client
  CLIENT_TAG: dusk-v0.2.7

  # The Sunshine this Dusk ships: its installer on Linux and Windows, and the
  # app itself inside Dusk on macOS (scripts/stage-host-macos.sh). Pinned for
  # the same reason as the client, and more so: the settings screen is built
  # against Sunshine's configuration keys, and a bump means re-testing it.
  SUNSHINE_TAG: v2026.914.233613
  # macOS runs ahead: 2026.914's input code keeps the pointer on the main
  # display, so after switching the stream to another screen the mouse is
  # dead. A later prerelease moves it within the captured display.
  #
  # These prereleases are garbage-collected by LizardByte within days, which
  # once left a pinned tag "release not found" and broke a macOS build that
  # had worked the day before. So macOS pulls from our own mirror of the
  # build, which nothing but us deletes. To bump: run
  #   ./scripts/mirror-sunshine-macos.sh <upstream tag>
  # then point the tag below at the sunshine-macos-<upstream tag> it makes.
  SUNSHINE_MACOS_REPO: ${{ github.repository }}
  SUNSHINE_MACOS_TAG: sunshine-macos-v2026.1028.122642

  # The GitHub OAuth app behind "Sign in with GitHub". A client ID, not a
  # secret: the device flow has none, so it is baked into the binary. Set it
  # as a repository variable; unset, the build ships with sign-in disabled.
  DUSK_GITHUB_CLIENT_ID: ${{ vars.DUSK_GITHUB_CLIENT_ID }}

  # The self-update's signing key. tauri.conf.json carries its public half,
  # and with createUpdaterArtifacts on, `tauri build` fails without this: an
  # update the app cannot verify is one it will refuse to install. The
  # private half lives in ~/.tauri/dusk.key on the maintainer's machine.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # Gates `publish`, not the builds. A tag must not produce a *shippable*
  # artifact from code that does not pass its own checks — but nothing a
  # build job makes is shippable until `publish` attaches it to the release,
  # so gating there keeps the same promise and lets the builds start at once.
  # Worth it: the builds take thirteen minutes and this takes nearly five, so
  # gating them serialised a third of the wall clock for no added safety. The
  # cost is runner minutes on a build that is then thrown away, which is the
  # cheaper of the two.
  #
  # One platform is enough for a gate — ci.yml runs the full three-OS matrix
  # on every pull request, and macOS is the one whose release path is signed.
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tauri::generate_context! reads the built frontend at compile time, so
      # the Rust crate cannot be checked until dist/ exists.
      - name: Typecheck and build the frontend
        run: npm run build

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lints
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  build-macos:
    name: Build (macOS universal)
    runs-on: macos-latest
    # Notarization waits on Apple's service, usually a couple of minutes but
    # with no guaranteed turnaround.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Developer ID certificate in 1Password contains only the leaf — no
      # "Developer ID Certification Authority (G2)" intermediate. Without it
      # codesign cannot build a chain to the Apple root and fails with
      # errSecInternalComponent. Apple publishes the intermediate, so fetch it
      # rather than requiring the stored .p12 to be re-exported.
      #
      # It goes in a dedicated keychain appended to the search list: Tauri
      # creates its own keychain for the signing identity, and codesign builds
      # the chain across every keychain in the list.
      - name: Install the Apple Developer ID intermediate
        run: |
          set -euo pipefail
          pw="$(openssl rand -base64 24)"
          security create-keychain -p "$pw" ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p "$pw" ci.keychain

          curl -fsSL --retry 3 -o /tmp/DeveloperIDG2CA.cer \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          # Confirm this is the intermediate the certificate chains to before
          # trusting it, rather than importing whatever the URL returned.
          subject="$(openssl x509 -inform DER -in /tmp/DeveloperIDG2CA.cer -noout -subject)"
          echo "fetched: $subject"
          case "$subject" in
            *"Developer ID Certification Authority"*) ;;
            *) echo "::error::unexpected certificate at Apple's intermediate URL"; exit 1 ;;
          esac

          security import /tmp/DeveloperIDG2CA.cer -k ci.keychain
          # Append rather than replace, so Tauri's own keychain still resolves.
          security list-keychains -d user -s ci.keychain \
            $(security list-keychains -d user | tr -d '"')
          security list-keychains -d user

          # The signing identity goes in the same keychain, because the
          # nested client has to be signed *before* Tauri bundles it — a
          # signature lives inside the bundle it covers, so it survives the
          # copy, and signing the outer app afterwards does not reach inside
          # a nested one. Tauri still makes its own keychain for its own
          # signing pass; this one only serves the staging step.
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/identity.p12
          security import /tmp/identity.p12 -k ci.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f /tmp/identity.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pw" ci.keychain >/dev/null
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Fetch the Moonlight client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CLIENT_TAG" --repo "$CLIENT_REPO" \
            --pattern 'dusk-client-macos.tar.gz' --dir /tmp/client
          # tar, not unzip: the framework symlinks have to survive, and
          # losing them here would fail notarization a quarter of an hour
          # later with nothing pointing back at this step.
          tar xzf /tmp/client/dusk-client-macos.tar.gz -C /tmp/client
          find /tmp/client/Moonlight.app/Contents/Frameworks -maxdepth 2 -type l | head -3

      # Sunshine's two per-CPU apps merged into one universal Dusk Host.app,
      # inserted into Contents/Helpers by package-macos.sh below.
      - name: Stage the hosting helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/stage-host-macos.sh "$SUNSHINE_MACOS_TAG" /tmp/host

      # The source offer in licenses/ names exact versions. The upstream
      # Sunshine version is the mirror tag with its "sunshine-macos-" prefix
      # removed, so the doc names LizardByte's build, not our copy of it.
      - name: Record shipped versions
        run: |
          printf 'moonlight-qt fork  %s\nSunshine           %s\n' \
            "$CLIENT_TAG" "${SUNSHINE_MACOS_TAG#sunshine-macos-}" > src-tauri/licenses/versions.txt

      # The app only. The disk image is built afterwards, by package-macos.sh,
      # because the client has to be inside the app before an image is made
      # around it — and deliberately without APPLE_ID, so Tauri signs but does
      # not notarize: notarizing here would staple a ticket to a bundle that
      # is about to change.
      - name: Build and sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app

      # Insert, sign inside out, re-sign the app, notarize it, build the
      # image. See the note at the top of the script for why none of this can
      # go through Tauri's bundle.resources.
      - name: Insert the client and host, sign and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLIENT_KEYCHAIN: ci.keychain
        run: ./scripts/package-macos.sh /tmp/client/Moonlight.app --host "/tmp/host/Dusk Host.app"

      # Same script the local build runs, so the two cannot drift. It
      # notarizes and staples the .dmg (Tauri builds the image after stapling
      # the app, leaving the image itself without a ticket) and fails the job
      # if either artifact does not pass Gatekeeper.
      - name: Notarize the disk image and verify
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/finalize-macos-release.sh

      # The update archive Tauri made at build time is of the app before the
      # client and host went in, and before it was notarized: installing it
      # would update Dusk into one that cannot stream or host. So it is made
      # again from the finished app and signed again. tar, for the framework
      # symlinks, as with the client above. Signed with the key in the job's
      # environment.
      - name: Archive the finished app for the updater
        run: |
          set -euo pipefail
          macos_dir="$(find src-tauri/target -maxdepth 5 -type d -path '*/bundle/macos' | head -1)"
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          archive="$PWD/artifacts/Dusk_${version}_universal.app.tar.gz"
          mkdir -p artifacts
          rm -f "$macos_dir"/*.app.tar.gz "$macos_dir"/*.app.tar.gz.sig
          # Without macOS metadata: bsdtar otherwise adds ._ AppleDouble files,
          # which unpack into the bundle and break its signature.
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$archive" -C "$macos_dir" Dusk.app
          npx tauri signer sign "$archive"
          ls -la artifacts

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find src-tauri/target -maxdepth 5 -name '*.dmg' -exec cp {} artifacts/ \;
          ls -la artifacts
          test -n "$(ls artifacts/*.dmg)" || { echo "::error::no .dmg produced"; exit 1; }

      # The three build jobs each upload their own artifact and none of them
      # touches the release. Creating it is the publish job's business alone:
      # three jobs racing to `gh release create` the same tag is a race with a
      # torn release at the end of it.
      - uses: actions/upload-artifact@v4
        with:
          name: dusk-macos-universal
          path: artifacts/*
          if-no-files-found: error

  # Unsigned, and visibly so: there is no Authenticode certificate for this
  # project, so SmartScreen shows "Windows protected your PC" on first run and
  # the person has to click through More info → Run anyway. Signing it means
  # either an OV/EV certificate or Azure Trusted Signing, both of which need a
  # verified organisation, so it waits until there is demand to justify one.
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stage the Moonlight client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CLIENT_TAG" --repo "$CLIENT_REPO" \
            --pattern 'dusk-client-windows-x64.zip' --dir /tmp/client
          unzip -q /tmp/client/dusk-client-windows-x64.zip -d /tmp/client/deploy
          ./scripts/stage-client.sh /tmp/client/deploy

      - name: Stage Sunshine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/stage-sunshine.sh "$SUNSHINE_TAG"
          printf 'moonlight-qt fork  %s\nSunshine           %s\n' \
            "$CLIENT_TAG" "$SUNSHINE_TAG" > src-tauri/licenses/versions.txt

      # Both installers, because they are not interchangeable: the MSI is what
      # a managed or scripted install wants, and NSIS produces the per-user
      # setup.exe that installs without administrator rights. Dusk itself does
      # not need elevation to run — only the Sunshine service control inside
      # it does, and that prompts when used.
      - name: Build
        run: npm run tauri build -- --bundles msi,nsis

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Only Tauri's bundle output, two levels down: the host installer
          # Dusk carries is copied into target/ as a resource, and a wider
          # search shipped it as a release asset of its own.
          find src-tauri/target/release/bundle -maxdepth 2 \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.msi.sig' -o -name '*-setup.exe.sig' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts
          test -n "$(ls -A artifacts)" || { echo "::error::no installer produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dusk-windows-x86_64
          path: artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build (Linux x86_64)
    # 22.04 rather than latest on purpose. An AppImage and a .deb are built
    # against the runner's glibc and webkit2gtk, so building on the newest
    # Ubuntu silently restricts the result to distributions that new. The
    # oldest runner available sets the floor as low as GitHub allows.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Same set ci.yml installs, plus the AppImage bundler's needs: it
      # reaches for file(1) and fuse to assemble and test the image, and
      # scripts/repair-appimage.sh for squashfs-tools to repack it.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            file \
            squashfs-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stage the Moonlight client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CLIENT_TAG" --repo "$CLIENT_REPO" \
            --pattern 'dusk-client-linux-x86_64.tar.gz' --dir /tmp/client
          tar xzf /tmp/client/dusk-client-linux-x86_64.tar.gz -C /tmp/client
          ./scripts/stage-client.sh /tmp/client/moonlight

      - name: Stage Sunshine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/stage-sunshine.sh "$SUNSHINE_TAG"
          printf 'moonlight-qt fork  %s\nSunshine           %s\n' \
            "$CLIENT_TAG" "$SUNSHINE_TAG" > src-tauri/licenses/versions.txt

      # deb and AppImage, not rpm. The .deb is the right answer on the
      # Debian-derived distributions most of this audience runs, and the
      # AppImage covers everything else without Dusk having to guess a
      # package manager — the same reasoning that picks the AppImage when
      # Dusk installs Sunshine itself, in install/release.rs.
      - name: Build
        run: npm run tauri build -- --bundles deb,appimage

      # The bundler signs the AppImage and not the .deb, because its updater
      # cannot install a .deb. Dusk's own can, and checks the same signature
      # before handing the file to a root process, so the .deb needs one too.
      - name: Sign the .deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          deb="$(find src-tauri/target/release/bundle -maxdepth 2 -name '*.deb')"
          [[ -n "$deb" && "$(wc -l <<<"$deb")" -eq 1 ]] \
            || { echo "::error::expected exactly one .deb, found: ${deb:-none}" >&2; exit 1; }
          npx tauri signer sign "$deb"
          test -f "$deb.sig" || { echo "::error::no signature written beside $deb" >&2; exit 1; }

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Only Tauri's bundle output, two levels down: the host installer
          # Dusk carries is copied into target/ as a resource, and a wider
          # search shipped it as a release asset of its own.
          find src-tauri/target/release/bundle -maxdepth 2 \
            \( -name '*.deb' -o -name '*.deb.sig' \
               -o -name '*.AppImage' -o -name '*.AppImage.sig' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts
          test -n "$(ls -A artifacts)" || { echo "::error::no package produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dusk-linux-x86_64
          path: artifacts/*
          if-no-files-found: error

  # The manifest the installed Dusks read to find an update, assembled from
  # the three builds' signatures. Its own job rather than a publish step, so a
  # dry run builds and checks it too.
  updater-manifest:
    name: Updater manifest
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write latest.json
        run: ./scripts/write-latest-json.sh artifacts latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: dusk-updater-manifest
          path: latest.json
          if-no-files-found: error

  publish:
    name: Publish
    needs: [test, build-macos, build-windows, build-linux, updater-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `name`, so every build job's artifact lands here, one directory
      # each.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Same convention as axibridge: notes are written by hand in
      # RELEASE_NOTES.md and the release fails rather than shipping empty or
      # stale ones. Read before the release exists, so a tag with no notes
      # fails having created nothing at all.
      - name: Read the release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"

          awk -v ver="$tag" '
            /^Version v[0-9]/ { capture = ($2 == ver) ? 1 : 0; next }
            capture { print }
          ' RELEASE_NOTES.md > /tmp/notes.md

          if [ -z "$(tr -d '[:space:]' < /tmp/notes.md)" ]; then
            echo "::error::No RELEASE_NOTES.md section found for $tag. Add a 'Version $tag — <date>' entry and re-run." >&2
            exit 1
          fi

      # A draft first, so the publish step flips a release that is already
      # complete — a tag never produces a half-populated public one.
      # Re-runnable: an existing draft has its assets replaced.
      - name: Attach the artifacts to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"

          # download-artifact nests one directory per build job, so the files
          # are a level down rather than in artifacts/ itself.
          mapfile -t files < <(find artifacts -type f | sort)
          printf '%s\n' "${files[@]}"

          # Three platforms, so a missing one has to be caught here: each
          # build job fails on its own empty output, but a release with the
          # macOS .dmg and nothing else would otherwise publish quietly.
          # The .deb's signature is named because Dusk checks it before
          # handing the package to a root process: a release that shipped
          # the .deb without it would leave every Debian install unable to
          # update, and quietly.
          for want in '\.dmg$' '\.msi$' '\.exe$' '\.deb$' '\.deb\.sig$' '\.AppImage$' \
                      '\.app\.tar\.gz$' '\.sig$' '/latest\.json$'; do
            printf '%s\n' "${files[@]}" | grep -qE "$want" \
              || { echo "::error::no artifact matching $want"; exit 1; }
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file /tmp/notes.md
          else
            gh release create "$tag" "${files[@]}" \
              --draft --title "$tag" --notes-file /tmp/notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release edit "$tag" --draft=false
